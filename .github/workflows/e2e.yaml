name: E2E tests

on: 
    workflow_dispatch:

jobs:
    e2e-tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: setup node
              uses: actions/setup-node@v6
              with:
                  node-version: '24.0.0'

            - name: install dependencies
              run: npm ci

            - name: run e2e test
              run: npm run test:e2e
            